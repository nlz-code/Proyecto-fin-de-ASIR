<VirtualHost *:80>
    ServerName mobility-alliance.local
    ServerAlias www.mobility-alliance.local

    DocumentRoot "C:/Users/USER/OneDrive/Documentos/proyecto"
    DirectoryIndex index.php index.html

    <Directory "C:/Users/USER/OneDrive/Documentos/proyecto">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/mobility-alliance-error.log"
    CustomLog "logs/mobility-alliance-access.log" common
</VirtualHost>
